<header class="sticky top-0 z-50 border-b border-gray-200 bg-white shadow-sm">

    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4">

        <!-- Logo -->
        <a routerLink="/" class="text-3xl font-bold tracking-tight">
            <span class="text-red-600">Your</span>
            <span class="text-gray-900">Style</span>
        </a>

        <!-- Search -->
        <app-search-bar class="hidden flex-1 px-8 md:block"></app-search-bar>

        <!-- Desktop Navigation -->
        <nav class="hidden items-center gap-8 mr-4 lg:flex">

            <a routerLink="/" class="font-medium text-gray-700 transition hover:text-red-600">
                Inicio
            </a>

            <a routerLink="/catalogo" class="font-medium text-gray-700 transition hover:text-red-600">
                Catálogo
            </a>

            <a routerLink="/" class="font-medium text-gray-700 transition hover:text-red-600">
                Contacto
            </a>

        </nav>

        <!-- Icons -->
        <div class="flex items-center gap-4">

            @if (autenticado()) {

            <div class="relative group">

                <button type="button" class="transition hover:text-red-600">
                    <i class="fa-regular fa-user text-xl"></i>
                </button>

                <div
                    class="invisible absolute right-0 top-full z-50 mt-3 w-52 translate-y-1 rounded-lg border border-gray-200 bg-white p-2 opacity-0 shadow-lg transition-all group-hover:visible group-hover:translate-y-0 group-hover:opacity-100">

                    <div class="border-b border-gray-100 px-3 py-2">

                        <p class="text-xs text-gray-400">
                            Hola
                        </p>

                        <p class="truncate text-sm font-semibold text-gray-900">
                            {{ usuario()?.nombre }}
                        </p>

                    </div>

                    <button type="button" (click)="cerrarSesion()"
                        class="mt-1 w-full rounded-md px-3 py-2 text-left text-sm text-gray-600 transition hover:bg-gray-50 hover:text-red-600">
                        Cerrar sesión
                    </button>

                </div>

            </div>

            } @else {

            <a routerLink="/login" class="transition hover:scale-110 hover:text-red-600">
                <i class="fa-regular fa-user text-xl"></i>
            </a>

            }

            <!-- Cart -->
            <button class="relative transition hover:scale-110 hover:text-red-600">

                <i class="fa-solid fa-cart-shopping text-xl"></i>
                <span
                    class="absolute -right-2 -top-2 flex h-5 w-5 items-center justify-center rounded-full bg-red-600 text-xs font-semibold text-white">
                    0
                </span>

            </button>

            <!-- Mobile Button -->
            <button (click)="toggleMenu()" class="lg:hidden">

                @if(isMenuOpen()){
                <i class="fa-solid fa-xmark"></i>
                } @else {
                <i class="fa-solid fa-bars"></i>
                }

            </button>

        </div>
    </div>

    <!-- Mobile Search -->
    <div class="border-t border-gray-200 p-4 md:hidden">
        <app-search-bar></app-search-bar>
    </div>

    <!-- Mobile Menu -->
    @if(isMenuOpen()){

    <nav class="space-y-4 border-t border-gray-200 bg-white p-4 lg:hidden">

        <a routerLink="/" class="block font-medium text-gray-700">
            Inicio
        </a>

        <a routerLink="/catalogo" class="block font-medium text-gray-700">
            Catálogo
        </a>

        <a routerLink="/" class="block font-medium text-gray-700">
            Contacto
        </a>

    </nav>

    }

</header>
