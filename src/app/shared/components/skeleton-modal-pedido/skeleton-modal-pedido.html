<div class="animate-pulse space-y-6 p-4 sm:p-6">

    <!-- STATUS SKELETON -->

    <section class="overflow-hidden rounded-[1.25rem] border border-gray-100 bg-linear-to-br from-gray-50 to-white p-4 sm:p-5">
        <div class="flex items-center justify-between gap-4">
            <div class="min-w-0 flex-1">
                <div class="h-2.5 w-28 rounded-full bg-gray-200"></div>
                <div class="mt-2 h-5 w-32 rounded-md bg-gray-200"></div>
            </div>

            <div class="h-7 w-24 shrink-0 rounded-full bg-gray-200"></div>
        </div>

        <div class="relative mt-7">
            <div class="absolute left-[8%] right-[8%] top-4 h-0.5 bg-gray-200"></div>

            <div class="relative grid grid-cols-4 gap-2">
                @for (item of [1, 2, 3, 4]; track item) {
                    <div class="flex flex-col items-center gap-2">
                        <div class="h-8 w-8 rounded-full bg-gray-200"></div>
                        <div class="h-2 w-14 rounded-full bg-gray-200"></div>
                    </div>
                }
            </div>
        </div>
    </section>

    <!-- PRODUCTS SKELETON -->

    <section>
        <div class="mb-3 flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
                <div class="h-9 w-9 rounded-xl bg-gray-200"></div>

                <div>
                    <div class="h-3.5 w-20 rounded-md bg-gray-200"></div>
                    <div class="mt-1.5 h-2.5 w-14 rounded-full bg-gray-200"></div>
                </div>
            </div>

            <div class="text-right">
                <div class="ml-auto h-2 w-10 rounded-full bg-gray-200"></div>
                <div class="mt-1.5 ml-auto h-5 w-20 rounded-md bg-gray-200"></div>
            </div>
        </div>

        <div class="overflow-hidden rounded-[1.25rem] border border-gray-100 bg-white">
            <div class="max-h-70 overflow-hidden">
                @for (item of [1, 2, 3]; track item) {
                    <div
                        class="flex items-center justify-between gap-4 px-4 py-3.5"
                        [class.border-t]="item !== 1"
                        [class.border-gray-100]="item !== 1">

                        <div class="flex min-w-0 items-center gap-3">
                            <div class="h-12 w-12 shrink-0 rounded-xl bg-gray-200"></div>

                            <div class="min-w-0">
                                <div class="h-3.5 w-32 rounded-md bg-gray-200 sm:w-44"></div>
                                <div class="mt-2 h-2.5 w-24 rounded-full bg-gray-200"></div>
                            </div>
                        </div>

                        <div class="h-4 w-16 shrink-0 rounded-md bg-gray-200"></div>
                    </div>
                }
            </div>

            <div class="flex items-center justify-between border-t border-gray-100 bg-gray-50 px-4 py-4">
                <div>
                    <div class="h-2.5 w-24 rounded-full bg-gray-200"></div>
                    <div class="mt-2 h-2.5 w-36 rounded-full bg-gray-200"></div>
                </div>

                <div class="h-6 w-24 rounded-md bg-gray-200"></div>
            </div>
        </div>
    </section>

    <!-- INFORMATION SKELETON -->

    <div class="grid gap-4 sm:grid-cols-2">

        <!-- DELIVERY -->

        <section>
            <div class="mb-3 flex items-center gap-2">
                <div class="h-9 w-9 rounded-xl bg-gray-200"></div>

                <div>
                    <div class="h-3.5 w-16 rounded-md bg-gray-200"></div>
                    <div class="mt-1.5 h-2.5 w-36 rounded-full bg-gray-200"></div>
                </div>
            </div>

            <div class="h-full min-h-32 rounded-[1.25rem] border border-gray-100 bg-gray-50/60 p-4">
                <div class="h-3 w-44 rounded-md bg-gray-200"></div>
                <div class="mt-3 h-2.5 w-36 rounded-full bg-gray-200"></div>
                <div class="mt-2 h-2.5 w-28 rounded-full bg-gray-200"></div>

                <div class="mt-4 border-t border-gray-200 pt-3">
                    <div class="h-2 w-16 rounded-full bg-gray-200"></div>
                    <div class="mt-2 h-2.5 w-40 rounded-full bg-gray-200"></div>
                </div>
            </div>
        </section>

        <!-- PAYMENT -->

        <section>
            <div class="mb-3 flex items-center gap-2">
                <div class="h-9 w-9 rounded-xl bg-gray-200"></div>

                <div>
                    <div class="h-3.5 w-24 rounded-md bg-gray-200"></div>
                    <div class="mt-1.5 h-2.5 w-28 rounded-full bg-gray-200"></div>
                </div>
            </div>

            <div class="flex min-h-27.5 items-center gap-3 rounded-[1.25rem] border border-gray-100 bg-gray-50/60 p-4">
                <div class="h-10 w-10 shrink-0 rounded-xl bg-gray-200"></div>

                <div>
                    <div class="h-2 w-24 rounded-full bg-gray-200"></div>
                    <div class="mt-2 h-3.5 w-28 rounded-md bg-gray-200"></div>
                </div>
            </div>
        </section>
    </div>

    <!-- DATE SKELETON -->

    <div class="flex items-center gap-2 rounded-xl bg-gray-50 px-3 py-2.5">
        <div class="h-3 w-3 shrink-0 rounded-full bg-gray-200"></div>
        <div class="h-2.5 w-64 max-w-full rounded-full bg-gray-200"></div>
    </div>

</div>
