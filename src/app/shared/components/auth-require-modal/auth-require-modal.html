<div class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-6" role="dialog"
    aria-modal="true"
    aria-labelledby="auth-modal-title"
    (click)="cerrarAlClickearBackdrop($event)"
>

    <div class="modal-enter w-full max-w-md rounded-xl border border-gray-200 bg-white p-6 shadow-xl sm:p-8">

        <!-- Icon -->
        <div class="flex h-12 w-12 items-center justify-center rounded-full bg-red-50">
            <i class="fa-regular fa-user text-lg text-red-600"></i>
        </div>


        <!-- Content -->
        <div class="mt-5">

            <h2 id="auth-modal-title" class="text-xl font-bold tracking-tight text-gray-950">
                ¿Ya tienes una cuenta?
            </h2>

            <p class="mt-2 text-sm leading-6 text-gray-500">
                Necesitas iniciar sesión para agregar productos a tu carrito.
                Así podras interactuar sin ningun problema.
            </p>

        </div>


        <!-- Actions -->
        <div class="mt-6 grid gap-3">

            <a routerLink="/login" (click)="cerrarModal()" class="rounded-lg bg-red-600 px-6 py-3 text-center text-sm font-semibold text-white transition hover:bg-red-700">
                Iniciar sesión
            </a>

            <a routerLink="/registro" (click)="cerrarModal()" class="rounded-lg border border-gray-200 px-6 py-3 text-center text-sm font-semibold text-gray-700 transition hover:bg-gray-50">
                Crear una cuenta
            </a>

        </div>


        <!-- Close -->
        <button type="button" (click)="cerrarModal()" class="mt-4 w-full text-center text-xs font-medium text-gray-400 transition hover:text-gray-700" >
            Continuar explorando
        </button>

    </div>

</div>
