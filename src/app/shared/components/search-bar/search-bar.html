<div class="relative">
    <div class="relative">
        <input type="text" [formControl]="query" (keydown.enter)="buscar()" (keydown.escape)="cerrar()" (focus)="query.value.trim() && mostrarResultados.set(true)" placeholder="Chaquetas, Polos, Zapatillas..." autocomplete="off" class="w-full rounded-lg border border-gray-300 bg-gray-50 py-2 pl-4 pr-10 text-gray-900 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-500" />
        <i class="fa-solid fa-magnifying-glass absolute right-3 top-3 text-gray-400"></i>
    </div>

    @if (mostrarResultados()) {

        <div class="absolute left-0 right-0 top-full z-70 mt-3 overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-2xl">

            <div class="border-b border-gray-100 px-5 py-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-[10px] font-bold uppercase tracking-[0.18em] text-red-600">Búsqueda</p>
                        <h3 class="mt-1 text-sm font-semibold text-gray-900">Resultados para <span class="text-red-600">"{{ query.value }}"</span></h3>
                    </div>

                    <button type="button" (click)="cerrar()" class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-50 text-gray-500 transition hover:bg-red-50 hover:text-red-600" aria-label="Cerrar búsqueda">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            @if (buscando()) {

                <div class="flex items-center justify-center px-6 py-10">
                    <i class="fa-solid fa-spinner fa-spin text-xl text-red-600"></i>
                </div>

            } @else if (resultados().length > 0) {

                <div class="max-h-95 overflow-y-auto px-6 py-4">
                    <div class="grid grid-cols-3 gap-3">

                        @for (producto of resultados(); track producto.id) {

                            <producto-card
                                [producto]="producto"
                                [compact]="true"
                                (seleccionado)="seleccionarProducto()"
                                >
                            </producto-card>

                        }

                    </div>

                </div>

                <div class="border-t border-gray-100 p-4">

                    <button type="button" (click)="buscar()" class="flex w-full items-center justify-center gap-2 rounded-xl bg-gray-900 px-4 py-3 text-sm font-semibold text-white transition-all duration-300 hover:bg-red-600">

                        Ver todos los resultados

                        <i class="fa-solid fa-arrow-right text-xs"></i>

                    </button>

                </div>

            } @else {

                <div class="px-6 py-10 text-center">
                    <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-gray-50 text-gray-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>

                    <p class="mt-4 text-sm font-semibold text-gray-900">No encontramos productos</p>
                    <p class="mt-1 text-xs text-gray-400">Intenta con otro término de búsqueda.</p>
                </div>

            }

        </div>
    }
</div>
