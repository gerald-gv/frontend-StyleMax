<!-- Header -->
<div class="mx-auto my-8 max-w-6xl sm:mb-10">

    <div class="flex flex-col gap-5 border-b border-gray-200 pb-6 sm:flex-row sm:items-end sm:justify-between">

        <div>

            <span class="text-xs font-bold uppercase tracking-[0.28em] text-red-600">
                Tu estilo
            </span>

            <h1 class="mt-2 text-3xl font-bold tracking-tight text-gray-950 sm:text-4xl" >
                Catálogo
            </h1>

            <p class="mt-2 max-w-lg text-sm leading-6 text-gray-500">
                Descubre prendas modernas y versátiles pensadas para acompañar
                tu estilo.
            </p>

        </div>

        <div class="text-xs font-medium uppercase tracking-[0.12em] text-gray-400">
            {{ productos().length }} • productos
        </div>

    </div>

</div>

<!-- Products -->
<div class="mx-auto my-6 md:my-8 lg:my-12 grid max-w-6xl grid-cols-2 gap-4 sm:grid-cols-3 sm:gap-5 lg:grid-cols-4 lg:gap-6">

    @for (producto of productos(); track producto.id) {

        <producto-card  [producto]="producto" />
    }
</div>
