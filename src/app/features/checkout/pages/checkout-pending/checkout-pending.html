<div class="mx-auto max-w-3xl px-6 py-16 sm:py-24">

    @if (cargando()) {

        <div class="text-center">

            <div class="mx-auto h-10 w-10 animate-spin rounded-full border-4 border-gray-200 border-t-red-600">
            </div>

            <p class="mt-5 text-sm text-gray-500">
                Consultando tu pedido...
            </p>

        </div>

    } @else {

        <div class="text-center">

            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-amber-50">
                <i class="fa-solid fa-clock text-2xl text-amber-600"></i>
            </div>

            <h1 class="mt-6 text-3xl font-bold tracking-tight text-gray-950">
                Pago pendiente
            </h1>

            <p class="mx-auto mt-3 max-w-md text-sm leading-6 text-gray-500">
                Tu pago está siendo procesado. Te mostraremos el estado
                actualizado de tu pedido cuando sea confirmado.
            </p>

        </div>


        @if (pedido(); as pedidoActual) {

            <div class="mt-10 rounded-xl border border-gray-200 bg-white p-6">

                <div class="flex justify-between">

                    <span class="text-sm text-gray-500">
                        Pedido
                    </span>

                    <span class="font-semibold text-gray-900">
                        #{{ pedidoActual.id }}
                    </span>

                </div>


                <div class="mt-4 flex justify-between border-t border-gray-100 pt-4">

                    <span class="text-sm text-gray-500">
                        Total
                    </span>

                    <span class="text-xl font-bold text-gray-950">
                        S/ {{ pedidoActual.total }}
                    </span>

                </div>

            </div>

        }


        <div class="mt-8 text-center">

            <a routerLink="/" class="inline-block rounded-lg border border-gray-300 px-6 py-3 text-sm font-semibold text-gray-700 transition hover:border-gray-400" >
                Volver al inicio
            </a>

        </div>

    }

</div>
