<header class="fixed inset-x-0 top-0 z-40 h-16 border-b border-gray-800 bg-gray-950 text-white">

    <div class="flex h-full items-center justify-between px-4 sm:px-6">

        <!-- LEFT -->

        <div class="flex items-center gap-3">

            <!-- Mobile menu -->

            <button type="button" (click)="toggleMenu.emit()"
                class="flex h-9 w-9 items-center justify-center rounded-lg text-gray-400 transition hover:bg-gray-800 hover:text-white lg:hidden"
                aria-label="Abrir menú">
                <i class="fa-solid fa-bars"></i>
            </button>

            <!-- Logo -->

            <a routerLink="/admin" class="flex items-center gap-3">

                <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-red-600 text-white">
                    <i class="fa-solid fa-shirt"></i>
                </div>

                <div class="hidden sm:block">

                    <p class="text-sm font-bold tracking-wide text-white">
                        <span class="text-red-600">Your</span>
                        <span class="text-gray-200">Style</span>
                    </p>

                    <p class="text-[11px] text-gray-500">
                        Administración
                    </p>

                </div>

            </a>

        </div>

        <!-- RIGHT -->

        <div class="flex items-center gap-3">

            <!-- Store -->

            <a routerLink="/" class="hidden items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-gray-400 transition hover:bg-gray-800 hover:text-white sm:flex">
                <i class="fa-solid fa-store text-xs"></i>
                <span>
                    Tienda
                </span>
            </a>

            <!-- Divider -->

            <div class="hidden h-7 w-px bg-gray-800 sm:block"></div>

            <!-- User -->

            <div class="flex items-center gap-3">

                <div class="flex h-9 w-9 items-center justify-center rounded-full bg-gray-800">
                    <i class="fa-solid fa-user text-sm text-gray-400"></i>
                </div>

                <div class="hidden text-left md:block">

                    <p class="text-sm font-medium text-white">
                        {{ usuario()?.nombre }}
                        {{ usuario()?.apellido }}
                    </p>

                    <p class="text-[11px] uppercase tracking-wide text-gray-500">
                        Administrador
                    </p>

                </div>

                <button type="button" (click)="solicitarCierreSesion.emit()" class="hidden h-9 w-9 items-center justify-center rounded-lg text-gray-500 transition hover:bg-red-600/10 hover:text-red-500 sm:flex"
                    title="Cerrar sesión" aria-label="Cerrar sesión">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>

            </div>

        </div>

    </div>

</header>
